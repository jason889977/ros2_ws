services:
  keyence_sr_wrapper:
    image: ${KEYENCE_IMAGE:-keyence_sr_wrapper_20260818_v1.0}
    container_name: ${KEYENCE_CONTAINER_NAME:-keyence_sr_wrapper}
    network_mode: host
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      SCANNER_IP: ${SCANNER_IP:-172.31.0.91}
      SCANNER_PORT: ${SCANNER_PORT:-9004}
    mem_limit: ${MEM_LIMIT:-1g}
    memswap_limit: ${MEM_SWAP_LIMIT:-1g}
    cpus: ${CPUS_LIMIT:-1.0}
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-50m}"
        max-file: "${LOG_MAX_FILE:-3}"
    healthcheck:
      test: ["CMD-SHELL", "/opt/ros2_ws/deploy/keyence_sr_wrapper/healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
