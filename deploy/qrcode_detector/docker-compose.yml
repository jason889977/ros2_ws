services:
  qrcode_detector:
    image: ${QR_IMAGE:-qrcode_detector_20260818_v1.0}
    container_name: ${QR_CONTAINER_NAME:-qrcode_detector}
    network_mode: host
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      IMAGE_TOPIC: ${IMAGE_TOPIC:-/my_camera/pylon_ros2_camera_node/image_raw}
      MODEL_DIR: ${MODEL_DIR:-}
      PREFER_WECHAT_QR: ${PREFER_WECHAT_QR:-false}
      QUEUE_SIZE: ${QUEUE_SIZE:-10}
    volumes:
      - ./config:/opt/ros2_ws/deploy/qrcode_detector/config:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/ros2_ws/deploy/qrcode_detector/healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 25s
