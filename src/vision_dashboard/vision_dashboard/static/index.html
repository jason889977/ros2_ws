<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>视觉控制台</title>
  <link rel="stylesheet" href="/static/console.css?v=__ASSET_VER__">
</head>
<body>
  <div id="app"></div>
  <template id="dashboard-template">
    <div class="dashboard">
      <div class="connection-banner" id="connectionBanner" role="status" hidden>连接已断开，正在重连...</div>
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">◎</span><div><strong>视觉控制台</strong><span>工业视觉运行中心</span></div></div>
        <div class="top-actions"><span class="status-pill"><i id="connectionDot"></i><span id="connectionText">连接中</span></span><span class="status-pill" id="streamText">等待数据...</span><button class="icon-button" id="themeButton" title="切换主题" aria-label="切换主题">◐</button><time id="clock">--:--:--</time></div>
      </header>
      <main class="main">
        <section class="page-heading"><div><span class="eyebrow">运行总览 / LIVE OPERATIONS</span><h1>生产视觉链路</h1><p id="summary">正在等待 ROS 2 状态数据...</p></div><div class="toolbar"><button class="button" id="refreshButton">刷新数据</button></div></section>
        <div class="notice" id="hardwareNotice" hidden></div>
        <section class="calibration-workspace" id="calibrationWorkspace">
          <header class="calibration-heading"><div><span class="eyebrow">CAMERA CALIBRATION / APRILGRID</span><h2>相机内参标定</h2></div><div class="toolbar"><span class="status-pill" id="calibrationServiceState">标定服务未运行</span><span class="status-pill" id="calibrationPhase">未开始</span><button class="button" id="calibrationStopService" hidden>停止服务</button><button class="button" id="calibrationNewSession">重新开始</button></div></header>
          <ol class="wizard-steps" id="wizardSteps">
            <li data-step="1"><b>① 启动标定</b><span>启动服务并新建采集会话</span></li>
            <li data-step="2"><b>② 逐步拍照</b><span>按提示采集多个视角</span></li>
            <li data-step="3"><b>③ 一键标定</b><span>自动计算内参</span></li>
            <li data-step="4"><b>④ 应用内参</b><span>写入相机配置</span></li>
          </ol>
          <div class="calibration-grid">
            <section class="calibration-view"><div class="calibration-live"><img id="calibrationImage" alt="标定实时画面"><div class="grid-overlay"><span>AprilGrid</span><span id="captureCount">0 张</span></div></div><div class="coverage"><header><b>采集覆盖度</b><span id="coverageHint">等待采集</span></header><div class="coverage-bars"><label>X<input id="coverageX" type="range" min="0" max="100" value="0" disabled><output id="coverageXValue">0%</output></label><label>Y<input id="coverageY" type="range" min="0" max="100" value="0" disabled><output id="coverageYValue">0%</output></label><label>Size<input id="coverageSize" type="range" min="0" max="100" value="0" disabled><output id="coverageSizeValue">0%</output></label><label>Skew<input id="coverageSkew" type="range" min="0" max="100" value="0" disabled><output id="coverageSkewValue">0%</output></label></div></div><div class="actions"><button class="button primary" id="calibrationCapture" disabled>拍照</button><button class="button danger" id="calibrationCancel" disabled>取消标定</button></div></section>
            <section class="calibration-controls">
              <div class="wizard-card" id="wizardPrepare" data-step="1"><h3>第一步：启动标定</h3><p class="muted">1. 准备 4x3 AprilGrid 标定板（Tag 36h11），粘贴平整无反光；2. 确认左侧实时画面正常；3. 点击"启动标定"。</p><div class="actions"><button class="button primary" id="calibrationBegin">启动标定</button></div></div>
              <div class="wizard-card" id="wizardCapture" data-step="2"><h3>第二步：逐步拍照</h3><ol class="pose-guide" id="poseGuide"></ol><p class="muted" id="poseHint">等待启动标定</p></div>
              <div class="wizard-card" id="wizardCalibrate" data-step="3"><h3>第三步：一键标定</h3><details class="advanced"><summary>高级参数（默认 4x3 / 36h11）</summary><div class="form-grid calibration-form"><label>行数<input id="calibRows" type="number" min="2" max="20" value="4"></label><label>列数<input id="calibCols" type="number" min="2" max="20" value="3"></label><label>Tag 尺寸 (m)<input id="calibTagSize" type="number" min="0.001" step="0.001" value="0.05"></label><label>Tag 间距 (m)<input id="calibTagSpacing" type="number" min="0" step="0.001" value="0.01"></label><label>Tag Family<select id="calibTagFamily"><option>tag36h11</option></select></label><label>最大重投影误差 (px)<input id="calibMaxError" type="number" min="0" step="0.1" value="2.0"></label><label>超时 (s)<input id="calibTimeout" type="number" min="0" step="30" value="300"></label></div></details><div class="actions"><button class="button primary" id="calibrationStart" disabled>一键标定</button></div><div class="calibration-progress"><div><span id="calibrationMessage">点击"启动标定"开始</span><b id="calibrationProgress">0 / 0</b></div><progress id="calibrationProgressBar" max="1" value="0"></progress></div></div>
              <div class="wizard-card" id="wizardApply" data-step="4"><h3>第四步：应用内参</h3><p class="muted" id="applyHint">标定完成后可将内参写入相机配置文件，重启流水线容器后生效。</p><div class="actions"><button class="button primary" id="calibrationApply" disabled>应用内参</button></div><div class="result" id="applyResult" role="status"></div></div>
            </section>
            <section class="calibration-captures"><header><h3>采集图像</h3><span class="muted" id="captureMeta">0 张</span></header><div class="capture-list" id="captureList"><div class="empty">尚未拍摄标定图像</div></div></section>
          </div>
          <section class="calibration-result" id="calibrationResult" hidden><header><div><h3>标定结果</h3><span class="muted" id="resultMeta"></span></div><div class="toolbar"><a class="button" id="calibrationDownload" download>下载 YAML</a></div></header><div class="result-grid"><div><span>重投影误差</span><strong id="resultError">--</strong><small>像素</small></div><div><span>有效图像</span><strong id="resultImages">--</strong><small>张</small></div><div class="matrix"><span>内参矩阵 K</span><code id="resultMatrix">--</code></div><div class="matrix"><span>畸变参数 D</span><code id="resultDistortion">--</code></div></div><div class="undistort-compare"><figure><img id="resultOriginal" alt="原始标定图像"><figcaption>原始画面</figcaption></figure><figure><img id="resultUndistorted" alt="去畸变预览"><figcaption>去畸变预览</figcaption></figure></div></section>
          <section class="calibration-history"><header><h3>历史标定记录</h3><span class="muted">本机归档</span></header><div id="calibrationHistory" class="history-list"><div class="empty">暂无历史标定记录</div></div></section>
        </section>

        <section class="calibration-workspace handeye-workspace" id="handeyeWorkspace">
          <header class="calibration-heading"><div><span class="eyebrow">HAND-EYE CALIBRATION / EYE-IN-HAND</span><h2>手眼标定（眼在手上）</h2></div><div class="toolbar"><span class="status-pill" id="handeyeTagState">标签位姿未就绪</span><span class="status-pill" id="handeyePhase">未开始</span><button class="button" id="handeyeNewSession">重新开始</button></div></header>
          <ol class="wizard-steps" id="handeyeWizardSteps">
            <li data-step="1"><b>① 配置参数</b><span>算法、TF 帧与阈值</span></li>
            <li data-step="2"><b>② 采集样本</b><span>输入机械臂位姿 + 采集图像</span></li>
            <li data-step="3"><b>③ 一键求解</b><span>自动计算手眼矩阵</span></li>
            <li data-step="4"><b>④ 应用结果</b><span>写入 YAML 并重载 TF</span></li>
          </ol>
          <div class="calibration-grid handeye-grid">
            <section class="calibration-view"><div class="calibration-live handeye-live"><img id="handeyeImage" alt="手眼标定实时画面"><div class="grid-overlay"><span>AprilTag 画面</span><span id="handeyeSampleCount">0 组</span></div></div><div class="diversity"><header><b>姿态多样性</b><span id="diversityHint">等待采集</span></header><div class="coverage-bars"><label>平移跨度<input id="diversityTrans" type="range" min="0" max="200" value="0" disabled><output id="diversityTransValue">0 mm</output></label><label>旋转跨度<input id="diversityRot" type="range" min="0" max="60" value="0" disabled><output id="diversityRotValue">0°</output></label><label>相邻旋转<input id="diversityConsec" type="range" min="0" max="30" value="0" disabled><output id="diversityConsecValue">0°</output></label></div></div><div class="actions"><button class="button primary" id="handeyeCaptureSample" disabled>采集样本</button></div></section>
            <section class="calibration-controls handeye-controls">
              <div class="wizard-card" id="handeyePrepare" data-step="1"><h3>第一步：配置参数</h3><details class="advanced" open><summary>标定算法与坐标帧</summary><div class="form-grid calibration-form"><label>求解算法<select id="handeyeAlgo"><option value="tsai">Tsai-Lenz</option><option value="park">Park-Martin</option><option value="horaud">Horaud</option><option value="daniilidis">Daniilidis</option></select></label><label>Base Frame<input id="handeyeBaseFrame" type="text" value="base_link"></label><label>Gripper Frame<input id="handeyeGripperFrame" type="text" value="tool0"></label><label>Camera Frame<input id="handeyeCameraFrame" type="text" value="camera_optical_frame"></label><label>Target Frame<input id="handeyeTargetFrame" type="text" value="apriltag_board"></label><label>最大闭环平移 (mm)<input id="handeyeMaxTrans" type="number" min="0" step="0.1" value="10.0"></label><label>最大闭环旋转 (°)<input id="handeyeMaxRot" type="number" min="0" step="0.01" value="0.5"></label></div></details><div class="actions"><button class="button primary" id="handeyeBegin">启动标定</button></div></div>
              <div class="wizard-card" id="handeyeCaptureCard" data-step="2"><h3>第二步：采集样本</h3><p class="muted" id="handeyePoseHint">请将机械臂移动到不同姿态，在下方输入位姿（x/y/z 单位 mm，欧拉角单位 °），并确认画面中 AprilTag 可见后点击"采集样本"。</p><div class="form-grid handeye-pose-form"><label>X (mm)<input id="poseXmm" type="number" step="0.01" value="0"></label><label>Y (mm)<input id="poseYmm" type="number" step="0.01" value="0"></label><label>Z (mm)<input id="poseZmm" type="number" step="0.01" value="0"></label><label>Roll (°)<input id="poseRoll" type="number" step="0.01" value="0"></label><label>Pitch (°)<input id="posePitch" type="number" step="0.01" value="0"></label><label>Yaw (°)<input id="poseYaw" type="number" step="0.01" value="0"></label></div><div class="actions"><button class="button primary" id="handeyeCaptureSample2" disabled>采集样本</button><button class="button" id="handeyePastePose">填入上次</button></div><div class="muted sample-diversity-tip" id="sampleTip">建议至少 10 组，覆盖平移 ≥ 20mm、旋转跨度 ≥ 15°。</div></div>
              <div class="wizard-card" id="handeyeCalibrateCard" data-step="3"><h3>第三步：一键求解</h3><p class="muted">手眼标定求解 AX = XB，使用采集到的 (机械臂, 标签) 位姿对。</p><div class="actions"><button class="button primary" id="handeyeStart" disabled>开始求解</button></div><div class="calibration-progress"><div><span id="handeyeMessage">点击"启动标定"开始</span><b id="handeyeProgress">0 组样本</b></div><progress id="handeyeProgressBar" max="1" value="0"></progress></div></div>
              <div class="wizard-card" id="handeyeApplyCard" data-step="4"><h3>第四步：应用结果</h3><p class="muted" id="handeyeApplyHint">求解完成后点击"应用手眼"写入配置路径，TF 广播器自动重载。</p><div class="actions"><button class="button primary" id="handeyeApply" disabled>应用手眼</button></div><div class="result" id="handeyeApplyResult" role="status"></div></div>
            </section>
            <section class="calibration-captures handeye-samples"><header><h3>已采集样本</h3><span class="muted" id="handeyeSampleMeta">0 组</span></header><div class="capture-list" id="handeyeSampleList"><div class="empty">尚未采集手眼样本</div></div></section>
          </div>
          <section class="calibration-result" id="handeyeResult" hidden><header><div><h3>手眼标定结果</h3><span class="muted" id="handeyeResultMeta"></span></div><div class="toolbar"><a class="button" id="handeyeDownload" download>下载 YAML</a></div></header><div class="result-grid handeye-result-grid"><div><span>闭环平均平移</span><strong id="handeyeMeanTrans">--</strong><small>mm</small></div><div><span>闭环最大平移</span><strong id="handeyeMaxTransR">--</strong><small>mm</small></div><div><span>闭环平均旋转</span><strong id="handeyeMeanRot">--</strong><small>°</small></div><div><span>闭环最大旋转</span><strong id="handeyeMaxRotR">--</strong><small>°</small></div><div class="matrix"><span>Camera → Gripper 平移</span><code id="handeyeC2GTrans">--</code></div><div class="matrix"><span>算法 / 样本数</span><code id="handeyeAlgoSamples">--</code></div><div class="matrix" style="grid-column: span 2;"><span>Gripper → Camera 矩阵 (4x4)</span><code id="handeyeG2CMatrix">--</code></div></div></section>
          <section class="calibration-history"><header><h3>历史手眼标定</h3><span class="muted">本机归档</span></header><div id="handeyeHistory" class="history-list"><div class="empty">暂无历史手眼标定记录</div></div></section>
        </section>
        <div class="layout">
          <section class="stack">
            <div class="metrics"><article><span>累计扫码</span><strong class="cyan" id="scanCount">--</strong><small>Keyence</small></article><article><span>扫码速率</span><strong class="green" id="scanRate">--</strong><small>次 / 分钟</small></article><article><span>空闲时长</span><strong class="amber" id="missDuration">--</strong><small>距上次扫码</small></article><article><span>组件状态</span><strong id="componentCount">--</strong><small id="componentHint">等待状态</small></article></div>
            <section class="panel feed-panel"><header><h2>实时画面</h2><div class="toolbar"><span class="muted" id="feedMeta">帧率未知</span><button class="button" id="snapshotButton">抓取快照</button></div></header><div class="feed"><div class="feed-tools"><span class="status-pill" id="cameraBadge">相机</span><button class="button" id="liveButton">启动实时流</button></div><img id="feedImage" alt="相机实时画面" hidden><div class="empty" id="feedEmpty"><b>等待图像帧</b><span>确认相机连接与 camera_info 发布状态</span></div></div></section>
            <section class="panel"><header><h2>组件健康</h2><div class="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="1">警告</button><button class="filter" data-filter="2">错误</button></div></header><div class="panel-body"><div class="list" id="healthList"></div></div></section>
            <section class="panel"><header><h2>扫码历史</h2><span class="muted" id="scanMeta">0 条记录</span></header><div class="table-wrap"><table><thead><tr><th>时间</th><th>来源</th><th>识别内容</th></tr></thead><tbody id="scanTable"></tbody></table></div></section>
          </section>
          <aside class="stack">
            <section class="panel"><header><h2>安全控制</h2><span class="status-pill">热更新白名单</span></header><div class="panel-body"><div class="form-grid"><label>曝光时间 (μs)<input id="exposure" type="number" min="100" max="1000000" step="100" value="10000"></label><label>增益 (dB)<input id="gain" type="number" min="0" max="100" step="0.1" value="0"></label><label>Gamma<input id="gamma" type="number" min="0.1" max="4" step="0.1" value="1"></label><label>亮度<input id="brightness" type="number" min="1" max="255" step="1" value="100"></label><label>水平 binning<input id="binningX" type="number" min="1" max="32" value="1"></label><label>垂直 binning<input id="binningY" type="number" min="1" max="32" value="1"></label></div><div class="actions"><button class="button primary" id="applyExposure">应用曝光</button><button class="button primary" id="applyGain">应用增益</button></div><div class="actions"><button class="button" id="applyImage">应用图像参数</button><button class="button danger" id="triggerScan">触发扫码</button></div><div class="result" id="controlResult" role="status"></div></div></section>
            <section class="panel"><header><h2>故障诊断</h2><span class="muted" id="diagMeta">0 项</span></header><div class="panel-body"><div class="diagnostics" id="diagnostics"></div></div></section>
            <section class="panel"><header><h2>事件时间线</h2><button class="filter" id="eventsButton">刷新</button></header><div class="panel-body"><div class="list" id="events"></div></div></section>
          </aside>
        </div>
      </main>
    </div>
  </template>
  <script src="/static/console.js?v=__ASSET_VER__"></script>
</body>
</html>
